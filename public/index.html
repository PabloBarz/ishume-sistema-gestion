<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vista demostrativa de la plantilla administrativa de ISHUME">
    <title>ISHUME · Panel demostrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <span class="brand-icon" aria-hidden="true"><i class="bi bi-box-seam-fill"></i></span>
        <div>
          <div class="brand-name">ISHUME</div>
          <div class="brand-sub">Panel de gestión</div>
        </div>
        <button class="btn-close-sidebar" id="btnCloseSidebar" type="button" aria-label="Cerrar menú">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Secciones">
        <div class="nav-section-label">Panel</div>
        <a class="nav-item active" href="#/dashboard" data-page="dashboard" aria-current="page">
          <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
          <span>Dashboard</span>
        </a>
        <div class="nav-section-label">Desarrollo</div>
        <a class="nav-item" href="#/ejemplo" data-page="ejemplo">
          <i class="bi bi-ui-checks" aria-hidden="true"></i>
          <span>Vista de ejemplo</span>
        </a>
        <div class="nav-section-label">Compras</div>
        <a class="nav-item" href="#/contratos" data-page="contratos">
          <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
          <span>Consultar contratos</span>
        </a>
        <a class="nav-item active" href="#/compras.html" data-page="compras" aria-current="page">
          <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
          <span>Compras</span>
        </a>
        <div class="nav-section-label">Ordenes</div>
        <a class="nav-item active" href="views/ordenes_compra.html" data-page="dashboard" aria-current="page">
          <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
          <span>Ordenes_compra</span>
        </a>
        <div class="nav-section-label">Inventario</div>
        <a class="nav-item" href="#/inventario" data-page="inventario">
          <i class="bi bi-boxes" aria-hidden="true"></i>
          <span>Inventario</span>
        </a>
        <div class="nav-section-label">Próximamente</div>
        <span class="nav-item nav-item-disabled"><i class="bi bi-cart-plus" aria-hidden="true"></i><span>Compras</span></span>
        <span class="nav-item nav-item-disabled"><i class="bi bi-receipt" aria-hidden="true"></i><span>Pagos</span></span>
      </nav>

      <div class="sidebar-footer">
        <span class="footer-icon" aria-hidden="true"><i class="bi bi-palette"></i></span>
        <div>
          <strong>Plantilla visual</strong>
          <small>Sin datos reales</small>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" hidden aria-hidden="true"></div>

    <main class="main-content" tabindex="-1">
      <header class="topbar">
        <button class="btn-toggle-sidebar" id="btnToggleSidebar" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="text-sm text-muted">Vista demostrativa</span>
        </div>
      </header>

      <!-- El router carga aquí la vista activa sin volver a dibujar este shell. -->
      <div class="page-wrapper" id="pageContainer" aria-live="polite" aria-busy="true">
        <div class="empty-state" role="status">Cargando dashboard de demostración…</div>
      </div>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
