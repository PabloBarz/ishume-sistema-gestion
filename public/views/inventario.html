<section class="inventory-page" aria-labelledby="inventory-title">
  <div class="page-header">
    <div>
      <h1 class="page-title" id="inventory-title">Catálogo</h1>
      <p class="page-subtitle">Modelos y precios para compras bajo pedido</p>
    </div>
  </div>

  <div class="stats-grid inventory-stats" aria-label="Indicadores del catálogo">
    <article class="stat-card"><span class="stat-value" data-stat="models">Cargando…</span><span class="stat-label">Modelos registrados</span></article>
    <article class="stat-card"><span class="stat-value" data-stat="designs">Cargando…</span><span class="stat-label">Diseños</span></article>
    <article class="stat-card"><span class="stat-value" data-stat="categories">Cargando…</span><span class="stat-label">Categorías</span></article>
  </div>

  <section class="card-panel inventory-catalog" aria-labelledby="inventory-catalog-title">
    <div class="panel-header inventory-panel-header">
      <div>
        <h2 class="panel-title" id="inventory-catalog-title">Catálogo de modelos</h2>
        <span class="panel-caption" id="inventory-caption">Consulta los registros del sistema</span>
      </div>
      <button class="btn-primary-action" id="categoryCreateButton" type="button" hidden>
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva categoría
      </button>
      <button class="btn-primary-action" id="designCreateButton" type="button" hidden>
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo diseño
      </button>
      <button class="btn-primary-action" id="modelCreateButton" type="button" hidden>
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo modelo
      </button>
    </div>

    <div class="inventory-tablist" role="tablist" aria-label="Catálogos">
      <button class="inventory-tab" id="tab-categorias" type="button" role="tab" aria-selected="false" aria-controls="inventory-panel" tabindex="-1" data-catalog="categorias">Categorías</button>
      <button class="inventory-tab" id="tab-disenios" type="button" role="tab" aria-selected="false" aria-controls="inventory-panel" tabindex="-1" data-catalog="disenios">Diseños</button>
      <button class="inventory-tab active" id="tab-modelos" type="button" role="tab" aria-selected="true" aria-controls="inventory-panel" data-catalog="modelos">Modelos</button>
    </div>

    <div class="inventory-toolbar" aria-label="Búsqueda y filtros">
      <label class="search-input-wrap">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>
        <input class="search-input" id="inventory-search" type="search" placeholder="Búsqueda disponible en una próxima fase" disabled aria-label="Buscar en el catálogo">
      </label>
      <select class="filter-select" id="categoryStateFilter" aria-label="Filtrar categorías por estado" hidden disabled>
        <option value="">Todos</option>
        <option value="1">Activos</option>
        <option value="0">Inactivos</option>
      </select>
      <select class="filter-select" id="designCategoryFilter" aria-label="Filtrar diseños por categoría" hidden disabled>
        <option value="">Todas las categorías</option>
      </select>
      <select class="filter-select" id="designStateFilter" aria-label="Filtrar diseños por estado" hidden disabled>
        <option value="">Todos</option>
        <option value="1">Activos</option>
        <option value="0">Inactivos</option>
      </select>
      <select class="filter-select" id="modelCategoryFilter" aria-label="Filtrar modelos por categoría" hidden disabled><option value="">Todas las categorías</option></select>
      <select class="filter-select" id="modelDesignFilter" aria-label="Filtrar modelos por diseño" hidden disabled><option value="">Todos los diseños</option></select>
      <select class="filter-select" id="modelLevelFilter" aria-label="Filtrar modelos por nivel educativo" hidden disabled><option value="">Todos los niveles</option></select>
      <select class="filter-select" id="modelStateFilter" aria-label="Filtrar modelos por estado" hidden disabled>
        <option value="">Todos</option><option value="1">Activos</option><option value="0">Inactivos</option>
      </select>
      <span class="inventory-filter-placeholder" id="inventory-filter-placeholder">Los filtros estarán disponibles en una próxima fase</span>
    </div>

    <div id="inventory-panel" class="inventory-table-panel" role="tabpanel" aria-labelledby="tab-modelos" tabindex="0" aria-live="polite"></div>
  </section>

  <div class="modal-overlay" id="inventoryModal" aria-hidden="true">
    <div class="modal-panel" aria-labelledby="inventoryModalTitle" aria-describedby="inventoryModalSubtitle">
      <div class="modal-header-custom">
        <div>
          <h2 class="modal-title-custom" id="inventoryModalTitle"></h2>
          <p class="modal-subtitle" id="inventoryModalSubtitle"></p>
        </div>
        <button class="btn-modal-close" id="inventoryModalClose" type="button" aria-label="Cerrar ventana">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body-custom" id="inventoryModalBody"></div>
      <div class="modal-footer-custom" id="inventoryModalFooter"></div>
    </div>
  </div>
</section>
