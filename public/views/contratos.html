<section class="ordenes-contenido preparar-pedidos" aria-labelledby="contratos-title">
  <div class="page-header"><div>
    <h1 class="page-title" id="contratos-title">Órdenes de compra</h1>
    <p class="page-subtitle" id="ordenPaso">Selecciona colegios y asigna proveedores a sus productos</p>
  </div></div>
  <p id="contratoEstado" role="status" aria-live="polite">Cargando proveedores…</p>
  <div id="ordenEditor">
  <dl class="pedido-indicadores" aria-label="Resumen del pedido en preparación" aria-live="polite" aria-atomic="true">
    <div class="pedido-indicador"><dt>Colegios agregados</dt><dd id="pedidoIndicadorColegios">0</dd><i class="bi bi-building" aria-hidden="true"></i></div>
    <div class="pedido-indicador"><dt>Proveedores asignados</dt><dd id="pedidoIndicadorProveedores">0</dd><i class="bi bi-truck" aria-hidden="true"></i></div>
    <div class="pedido-indicador"><dt>Unidades a solicitar</dt><dd id="pedidoIndicadorUnidades">0</dd><i class="bi bi-box-seam" aria-hidden="true"></i></div>
  </dl>
  <section class="colegios-agregados" aria-label="Colegios seleccionados" hidden>
    <div class="panel-stack" id="contratoColegios"></div>
  </section>
  <div class="colegio-agregar-accion"><button class="btn-cancel" id="colegioAgregar" type="button" aria-expanded="false" aria-controls="colegioBuscadorPanel" hidden>+ Agregar colegio</button></div>
  <section class="card-panel" id="colegioBuscadorPanel" aria-label="Buscar colegio">
    <form class="panel-body colegio-buscador" id="contratoForm" role="search">
      <div class="colegio-buscador-header"><label class="form-label-custom" for="colegioBusqueda">Agregar pedido</label><button class="colegio-cancelar-busqueda" id="colegioCancelar" type="button" hidden>Cancelar</button></div>
      <div class="colegio-buscador-campo"><i class="bi bi-search" aria-hidden="true"></i><input class="input-custom" id="colegioBusqueda" type="search" placeholder="Buscar colegio por nombre..." autocomplete="off" aria-controls="colegioResultados" aria-describedby="colegioBusquedaEstado" disabled></div>
      <p class="text-sm text-muted" id="colegioBusquedaEstado" role="status" aria-live="polite">Cargando colegios…</p>
      <button class="btn-cancel" id="colegioReintentar" type="button" hidden>Reintentar carga</button>
      <ul id="colegioResultados" class="colegio-resultados" aria-label="Colegios disponibles" hidden></ul>
    </form>
  </section>
  <section class="card-panel orden-accion" id="compraResumen" aria-label="Preparar órdenes" hidden>
    <div class="panel-body resumen-pedido-proveedores"><h2 class="panel-title">Resumen del pedido</h2><dl id="compraPedidosProveedor" class="pedidos-proveedor"></dl></div>
    <div class="panel-body resumen-footer">
      <div class="orden-accion-texto"><p id="compraAccionResumen"></p><p class="resumen-validacion" id="compraValidacion" role="status" aria-live="polite" hidden><i class="bi bi-check-circle-fill" id="compraValidacionIcono" aria-hidden="true" hidden></i><span id="compraValidacionTexto"></span></p></div>
      <button class="btn-primary-action" id="compraPreparar" type="button" disabled>Revisar pedido</button>
    </div>
  </section>
  </div>
  <div class="modal-overlay orden-confirmacion compras-modal" id="compraRevision" aria-hidden="true" hidden>
  <section class="card-panel revision-pedido modal-panel" aria-labelledby="compra-revision-title">
    <div class="modal-header-custom"><h2 class="modal-title-custom" id="compra-revision-title">Confirmar pedidos</h2></div>
    <div class="panel-body" id="compraRevisionContenido"></div>
    <p class="orden-modal-estado" id="compraRevisionEstado" role="status" aria-live="polite"></p>
    <div class="panel-body compra-totals revision-acciones">
      <button class="btn-cancel" id="compraEditar" type="button">Volver</button>
      <button class="btn-primary-action" id="compraConfirmar" type="button">Confirmar y guardar</button>
    </div>
  </section>
  </div>
</section>
